<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7c9aad" stroke-width="1.4"/></marker></defs><rect width="1200" height="640" fill="#f6f9fc"/><text x="30" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#254b65">CommonRoad Agentic Planner</text><text x="30" y="87" font-family="Arial,sans-serif" font-size="21" fill="#607d90">Reasoning, numerical planning, prediction, and execution remain distinct.</text><rect x="30" y="120" width="330" height="150" rx="8" fill="#ffffff" stroke="#bdcfdc" stroke-width="1.5"/><text x="48" y="157" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a5270">Observe the current world</text><text x="48" y="198" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Public road, actors, goal</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Current measured vehicle state</text><rect x="435" y="120" width="330" height="150" rx="8" fill="#e9eef9" stroke="#bdcfdc" stroke-width="1.5"/><text x="453" y="157" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a5270">Agent strategy</text><text x="453" y="198" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Algorithm, parameters, policies</text><text x="453" y="226" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Bounded tool-based delegation</text><rect x="840" y="120" width="330" height="150" rx="8" fill="#ffffff" stroke="#bdcfdc" stroke-width="1.5"/><text x="858" y="157" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a5270">Native planning and ranking</text><text x="858" y="198" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Generate checked candidates</text><text x="858" y="226" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Select by the configured objective</text><rect x="840" y="370" width="330" height="150" rx="8" fill="#ffffff" stroke="#bdcfdc" stroke-width="1.5"/><text x="858" y="407" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a5270">Selected ego forecast</text><text x="858" y="448" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Keep the native trajectory prefix</text><text x="858" y="476" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Complete missing tail up to 3s</text><rect x="435" y="370" width="330" height="150" rx="8" fill="#ffffff" stroke="#bdcfdc" stroke-width="1.5"/><text x="453" y="407" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a5270">Execution and traffic checks</text><text x="453" y="448" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Time-aligned occupancy evidence</text><text x="453" y="476" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Dynamics, road, actor and token gates</text><rect x="30" y="370" width="330" height="150" rx="8" fill="#ffffff" stroke="#bdcfdc" stroke-width="1.5"/><text x="48" y="407" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a5270">Reactive SUMO step</text><text x="48" y="448" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Execute one 0.1-second step</text><text x="48" y="476" font-family="Arial,sans-serif" font-size="19" fill="#5c768a">Return actual state and feedback</text><path d="M365 195H425" fill="none" stroke="#7c9aad" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M770 195H830" fill="none" stroke="#7c9aad" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1005 275V360" fill="none" stroke="#7c9aad" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M835 445H780" fill="none" stroke="#7c9aad" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 445H375" fill="none" stroke="#7c9aad" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M195 365V280" fill="none" stroke="#7c9aad" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="583" font-family="Arial,sans-serif" font-size="21" fill="#607d90">New risk or changed state returns evidence to the agent; delegation never bypasses the checks.</text></svg>