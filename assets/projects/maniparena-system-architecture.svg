<svg xmlns="http://www.w3.org/2000/svg" id="maniparena-system-svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="maniparena-diagram-title maniparena-diagram-description">
<title id="maniparena-diagram-title">ManipArena: asynchronous reasoning and learned robot control</title>
<desc id="maniparena-diagram-description">Observations feed an asynchronous planner, progress predictor, evidence bank and verifier, and a shared pi-zero-point-five VLA policy. A cached subtask conditions the policy. The robot executes decoded actions and returns fresh observations. Verified completion updates the cached subtask. Training adapts one shared policy from twenty task datasets.</desc>
<defs>
<marker id="ma-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63758b"/></marker>
<marker id="ma-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7950ba"/></marker>
<marker id="ma-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#117a78"/></marker>
</defs>
<style>#maniparena-system-svg text{font-family:Arial,Helvetica,sans-serif;fill:#243040}.ma-title{font-size:35px;font-weight:700}.ma-subtitle{font-size:26px;fill:#58677c}.ma-heading{font-size:30px;font-weight:700}.ma-body{font-size:25px}.ma-small{font-size:23px;fill:#58677c}.ma-label{font-size:23px;font-weight:700}.ma-box-title{font-size:25px;font-weight:700}.ma-line{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.ma-agent-line{stroke:#7950ba;marker-end:url(#ma-arrow-purple)}.ma-control-line{stroke:#117a78;marker-end:url(#ma-arrow-teal)}.ma-gray-line{stroke:#63758b;marker-end:url(#ma-arrow-gray)}</style>
