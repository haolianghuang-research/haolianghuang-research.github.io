<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc">
<title id="title">ManipArena: π₀.₅ adaptation, subtask training and Text-CFG</title>
<desc id="desc">Twenty task datasets share a common action representation and LoRA-adapted policy. Optional second-stage training pairs main-task-plus-subtask and main-task-only text conditions. Text-CFG combines their flow predictions during guided inference. The retained default deployment uses a single all-task checkpoint with Text-CFG disabled.</desc>
